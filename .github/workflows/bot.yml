name: sports-bot

on:
  schedule:
    # backup trigger every 10 minutes (the bot normally keeps itself running, see the last step)
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to both Discord channels"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# only one copy runs at a time; a new trigger waits for the running one
concurrency:
  group: sports-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Emoji font for the image cards
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji) > /dev/null 2>&1 || true

      - name: Test message
        if: ${{ inputs.test }}
        run: python3 bot.py --test
        env:
          NFL_WEBHOOK_URL: ${{ secrets.NFL_WEBHOOK_URL }}
          NBA_WEBHOOK_URL: ${{ secrets.NBA_WEBHOOK_URL }}

      - name: Watch games and post (stays on ~5h45m)
        if: ${{ !inputs.test }}
        run: python3 bot.py
        env:
          NFL_WEBHOOK_URL: ${{ secrets.NFL_WEBHOOK_URL }}
          NBA_WEBHOOK_URL: ${{ secrets.NBA_WEBHOOK_URL }}
          MAX_RUNTIME_MIN: "340"
          POLL_SECONDS: "45"
          IDLE_SECONDS: "300"
          KEEPALIVE: "1"

      - name: Save what has been posted
        if: always()
        run: |
          git config user.name "sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase -X theirs || true
            git push
          fi

      - name: Start the next run
        if: ${{ !cancelled() && !inputs.test }}
        run: gh workflow run bot.yml --ref "${{ github.event.repository.default_branch }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
